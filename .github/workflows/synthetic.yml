name: Synthetic-only checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify approved file set and hashes
        run: python3 tools/verify_publication.py
      - name: Run fictional offline tests
        run: python3 -m unittest discover -s tests -v
